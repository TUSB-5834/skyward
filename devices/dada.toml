[device]
codename = "dada"
brand = "Xiaomi"
model = "Xiaomi 15"
ab = true
soc = { hans = "骁龙®8至尊版移动平台", hant = "Snapdragon® 8 Elite 行動平台", en = "Snapdragon® 8 Elite Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# persist.sys.miui_resolution in the odm partition's build.prop, which is
# vendor.display.default_resolution there as well.
width = 1200
height = 2670
density = 520
# The O3 panel's native 422 DSC stream requires subpixel packing before
# compression. Without SPR, blue appears magenta and red appears green.
spr = "dada-o3"

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The touchscreen: Synaptics TouchComm over SPI behind Xiaomi's touch
# layer, the one touch driver the phone's own modules.load lists.
load = ["synaptics_tcm2", "stm_st54se_gpio", "stm_nfc_i2c"]

# These nodes are created after the recovery's initial ueventd ownership
# pass. Match the installed vendor ueventd.rc before starting the eSE HAL.
[[owners]]
user = "system"
group = "system"
mode = 0o660
paths = ["/dev/st54spi_gpio"]

[[owners]]
user = "nfc"
group = "nfc"
mode = 0o660
paths = ["/dev/st21nfc"]

# As on the 17 Ultra, no init script of the phone's starts touch_report:
# the touch feature service turns the controller's raw frames into
# touches with /odm/lib64/libtouchreport.so, and a recovery runs none of
# it. Told through Xiaomi's touch layer, the driver has the controller
# report positions itself; that is known of the 17 Ultra's Synaptics
# controller and not yet tried on this phone's.
[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. The kernel
# starts the CPU clusters on the performance governor, which holds them at
# their highest clock; the script hands them to WALT, lets idle CPUs power
# down and sets how the memory bus scales. Without it the CPUs stay at
# their highest clock and voltage even while idle, and the phone slowly
# heats up.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# The installed sun vendor build uses the Qualcomm AIDL key and credential
# services. Its Gatekeeper declaration is in manifest_sun.xml, outside
# the manifest/ directory searched automatically by the recovery.
[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]
sockets = [{ name = "notify-topology", kind = "stream", mode = 0o660, user = "system", group = "drmrpc" }]

# Match this dada's installed hlosminkdaemon.rc, including its inherited
# listener. This build's rc does not request additional capabilities.
[[service]]
path = "/vendor/bin/hlosminkdaemon"
libraries = ["/system/lib64", "/vendor/lib64", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
user = "system"
groups = ["system"]
sockets = [{ name = "hlos_mink_opener", kind = "stream", mode = 0o660, user = "system", group = "system" }]

# ssgtzd registers TA autoload/opener services. With it absent, the GP eSE
# session returned 11; adding it in RAM allowed HAL.init to succeed.
[[service]]
path = "/vendor/bin/ssgtzd"
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw", "/odm/lib64", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
user = "system"
groups = ["system", "oem_2912", "wakelock"]
capabilities = ["WAKE_ALARM", "BLOCK_SUSPEND"]
sockets = [
    { name = "ssgtzd", kind = "stream", mode = 0o660, user = "system", group = "oem_2912" },
    { name = "ssgtzd_opener", kind = "stream", mode = 0o660, user = "system", group = "system" },
]

[[service]]
path = "/vendor/bin/hw/android.hardware.security.keymint-service-qti"
libraries = ["/system/lib64", "/vendor/lib64", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
registers = [
    "android.hardware.security.keymint.IRemotelyProvisionedComponent/default",
    "android.hardware.security.secureclock.ISecureClock/default",
    "android.hardware.security.sharedsecret.ISharedSecret/default",
]
user = "system"
groups = ["system", "drmrpc"]

[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper-service-qti"
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
ready_service = "android.hardware.gatekeeper.IGatekeeper/default"
description = "/vendor/etc/vintf/manifest_sun.xml"
user = "system"
groups = ["system"]

[[service]]
path = "/vendor/bin/hw/android.hardware.secure_element-service.qti"
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw", "/odm/lib64", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
ready_service = "android.hardware.secure_element.ISecureElement/eSE1"
description = "/odm/etc/vintf/manifest/manifest_nfc_ese.xml"
user = "system"
groups = ["nfc", "system"]

[[service]]
path = "/odm/bin/hw/android.hardware.weaver-service.thales"
libraries = ["/system/lib64", "/vendor/lib64", "/odm/lib64", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
ready_service = "android.hardware.weaver.IWeaver/default"
user = "vendor_thales_weaver"
groups = ["vendor_thales_weaver", "system", "drmrpc"]

# Package the bridge with skyward-pack --omapi; it selects only the running
# stock Thales executable with UID 2916 and follows its lifetime.
[[service]]
path = "/skyward/omapi-bridge"
args = ["--weaver"]
libraries = ["/system/lib64"]
ready_service = "android.se.omapi.ISecureElementService/default"
description = "/skyward/omapi.xml"
user = "root"
groups = ["root"]

[firmware]
partition = "modem"

[partitions]
mounted = ["persist"]

# This dada enumerates Peach chip revision 2. The revision-1 module rejects
# it, and loading that module first prevents the revision-2 driver starting.
# cfg80211 also needs the rfkill module from system_dlkm. Mounting modem
# firmware covers vendor's firmware directory, so restore the v2 settings
# under the name requested by that driver. This installed build has no
# persist/wlan/wlan_mac.bin; the driver can obtain its address without it.
# wpa_supplicant runs on the recovery's own libraries before the vendor
# partition's, as on the 17 Ultra.
[wlan]
modules = ["rfkill", "qca_cld3_peach_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/peach_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/peach_v2/WCNSS_qcom_cfg.ini" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: the Chinese system's
# OS3.0.307.0, whose full update package on the phone maker's own download
# server holds the recovery partition the recovery is built on top of.
[stock]
version = "OS3.0.307.0.WOCCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.307.0.WOCCNXM/dada-ota_full-OS3.0.307.0.WOCCNXM-user-16.0-135abb5f28.zip"
recovery = "2efc22c0955b694cd5d8f44243e78f2e08d76d8011df0b9dc84de8b31d05334d"

# qcom-hv-haptics keeps click waveform 0. On dada it plays for 23 ms and
# gives stock-like feedback at 25% strength; the synthesized FIFO click
# used before this did not. Retain that tested lower end of the slider.
[haptics]
click = 0
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.5 }
